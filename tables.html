<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Time Table</title>

    <style>
<!--style for table-->
        body {
            font-family: Arial, sans-serif;
            background-color:darkgray;
            margin: 20px;
        }
<!--style for table-->
        h2 {
            text-align: center;
            color:teal;
            margin-bottom: 25px;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
        }
<!--Style for table heading and data-->
        th,
        td {
            border:2px solid color #1565c0;
            padding: 15px;
            text-align: center;
        }

        thead th {
            background-color: skyblue;
            color: white;
            font-weight: bold;
        }

        tbody th {
            background-color: #e3f2fd;
            color: darkblue;
        }

        tbody tr:nth-child(even) {
            background-color: #f5f5f5;
        }

        tbody tr:hover {
            background-color: #e8f5e9;
        }

        td {
            font-weight: 550;
        }

        td:empty {
            background-color: #eeeeee;
        }

        .lunch {
            background-color: #ffcc80;
            font-weight: bold;
            color: rgb(93, 64, 55);
        }

        .club {
            background-color: #ce93d8;
            font-weight: bold;
        }

        .activity {
            background-color: #80cbc4;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <h2>CLASS TIMETABLE</h2>

    <table>

        <thead>
            <tr>
                <th>Day / Time</th>
                <th>12:10-1:10</th>
                <th>1:10-2:10</th>
                <th>2:10-3:10</th>
                <th>3:10-4:10</th>
                <th>4:10-5:10</th>
                <th>5:10-6:10</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <th>Monday</th>
                <td>ACS</td>
                <td>AIS</td>
                <td class="club">CLUB</td>
                <td>EAR</td>
                <td rowspan="3" class="lunch">Lunch</td>
                <td>MD5</td>
            </tr>

            <tr>
                <th>Tuesday</th>
                <td>CS</td>
                <td>EAR</td>
                <td>WT</td>
                <td>MD5</td>
                <td>Java</td>
            </tr>

            <tr>
                <th>Wednesday</th>
                <td></td>
                <td>AIS</td>
                <td>WT</td>
                <td>AI</td>
                <td>MD5</td>
            </tr>

            <tr>
                <th>Thursday</th>
                <td>Java</td>
                <td>SE</td>
                <td>DBMS</td>
                <td></td>
                <td class="lunch">Lunch</td>
                <td>Library</td>
            </tr>

            <tr>
                <th>Friday</th>
                <td></td>
                <td>CN</td>
                <td class="activity">Forum Activity</td>
                <td class="lunch">Lunch</td>
                <td class="club">Club</td>
                <td></td>
            </tr>

        </tbody>

    </table>

</body>

</html>
